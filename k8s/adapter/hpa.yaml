apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: task-processor
  namespace: observability
  labels:
    app: task-processor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: task-processor
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Pods
      pods:
        metric:
          name: tasks_in_queue
        target:
          # Scale up when the average tasks_in_queue value per pod exceeds 10.
          type: AverageValue
          averageValue: "10"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-processor
  namespace: {{ .Values.namespace }}
  labels:
    app: task-processor
spec:
  replicas: {{ .Values.taskProcessor.replicaCount }}
  selector:
    matchLabels:
      app: task-processor
  template:
    metadata:
      labels:
        app: task-processor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: task-processor
          image: "{{ .Values.taskProcessor.image.repository }}:{{ .Values.taskProcessor.image.tag }}"
          imagePullPolicy: {{ .Values.taskProcessor.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: {{ .Values.taskProcessor.resources.requests.memory | quote }}
              cpu: {{ .Values.taskProcessor.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.taskProcessor.resources.limits.memory | quote }}
              cpu: {{ .Values.taskProcessor.resources.limits.cpu | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: task-processor
  namespace: {{ .Values.namespace }}
  labels:
    app: task-processor
spec:
  type: ClusterIP
  selector:
    app: task-processor
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
{{- if .Values.taskProcessor.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: task-processor
  namespace: {{ .Values.namespace }}
  labels:
    app: task-processor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: task-processor
  minReplicas: {{ .Values.taskProcessor.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.taskProcessor.autoscaling.maxReplicas }}
  metrics:
    - type: Pods
      pods:
        metric:
          name: tasks_in_queue
        target:
          type: AverageValue
          averageValue: {{ .Values.taskProcessor.autoscaling.targetAverageQueueDepth | quote }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
{{- end }}

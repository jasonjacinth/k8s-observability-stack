                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "auto",
                "stacking": {
                  "group": "A",
                  "mode": "none"
                }
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "legend": {
              "calcs": ["lastNotNull", "max"],
              "displayMode": "table",
              "placement": "bottom"

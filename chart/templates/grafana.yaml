                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "scheme",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "auto",
                "stacking": {
                  "group": "A",
                  "mode": "none"
                }
              },
              "unit": "s"

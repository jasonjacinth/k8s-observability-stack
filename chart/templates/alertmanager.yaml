apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: {{ .Values.namespace }}
  labels:
    app: prometheus
data:
  alerting-rules.yml: |
    groups:
      - name: task-processor-alerts
        rules:
          - alert: HighQueueBacklog
            expr: sum(tasks_in_queue) > 30
            for: 2m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "Task queue backlog is critically high"
              description: "The total tasks_in_queue has exceeded 30 for more than 2 minutes (current value: {{`{{ $value }}`}}). The application may be unable to process tasks fast enough."
              runbook_url: "https://github.com/jasonjacinth/k8s-observability-stack/blob/main/RUNBOOK.md#highqueuebacklog"

          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total{namespace="{{ .Values.namespace }}", container="task-processor"}[5m]) > 0
            for: 3m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "task-processor pod is crash-looping"
              description: "Pod {{`{{ $labels.pod }}`}} in namespace {{`{{ $labels.namespace }}`}} has been restarting repeatedly for more than 3 minutes."
              runbook_url: "https://github.com/jasonjacinth/k8s-observability-stack/blob/main/RUNBOOK.md#podcrashlooping"

      - name: task-processor-recording-rules
        rules:
          - record: task_processor:tasks_processed:rate1m
            expr: sum(rate(tasks_processed_total[1m]))

          - record: task_processor:http_request_duration:avg
            expr: |
              sum(rate(http_request_duration_seconds_sum{app="task-processor"}[1m]))
              /
              sum(rate(http_request_duration_seconds_count{app="task-processor"}[1m]))
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: {{ .Values.namespace }}
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: "default-webhook"
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      routes:
        - match:
            severity: critical
          receiver: "critical-webhook"
          group_wait: 10s
          repeat_interval: 1h

    receivers:
      - name: "default-webhook"
        webhook_configs:
          - url: "http://localhost:5001/webhook"
            send_resolved: true

      - name: "critical-webhook"
        webhook_configs:
          - url: "http://localhost:5001/webhook"
            send_resolved: true

    inhibit_rules:
      - source_match:
            severity: critical
        target_match:
            severity: warning
        equal: ["alertname", "namespace"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: {{ .Values.namespace }}
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: {{ .Values.alertmanager.image }}
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--web.external-url=http://localhost:9093"
          ports:
            - name: http
              containerPort: 9093
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: storage
              mountPath: /alertmanager
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: {{ .Values.namespace }}
  labels:
    app: alertmanager
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
      protocol: TCP
